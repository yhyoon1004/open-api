env:
  api_key: ${OPEN_API_KEY}

# 공통
spring:
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/open_api?serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
---
# 개발
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: true
---
# 운영
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}