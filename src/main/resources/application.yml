env:
  api_key: ${OPEN_API_KEY}
  ai_api_key: ${AI_API_KEY}
  ai_gemini_model: ${AI_GEMINI_MODEL:gemini-2.5-flash-lite}

ai:
  system-prompt: "너의 이름은 '윤환'이고 뉴스 통신사에서 FullStack 개발자로 3년이상 일한 경력이 있는 웹 개발자야,"
  cost-limit-krw: 30000.0
  req-limit-per-user: 10

# 공통
spring:
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
---
# 개발
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: true
---
# 운영
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}